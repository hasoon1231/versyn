[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versyn"
version = "0.2.1"
description = "Cryptographic proof for AI actions — sign AI decisions with Ed25519, verify offline with hash binding."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Versyn", email = "hello@versyn.dev" }]
keywords = ["ai", "audit", "ed25519", "cryptography", "agent", "compliance", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
dev = ["pytest>=8.0.0", "pytest-httpx>=0.30.0", "ruff", "mypy"]

[project.urls]
Homepage = "https://versyn.dev"
Repository = "https://github.com/hasoon1231/versyn"
"Bug Tracker" = "https://github.com/hasoon1231/versyn/issues"
"Public Key" = "https://versyn.dev/.well-known/versyn-pubkey.txt"

[tool.hatch.build.targets.wheel]
packages = ["src/versyn"]
